[workspace]
members = ["crates/vision-engine", "crates/vision-cli", "crates/vision-mcp", "crates/vision-browser"]
default-members = ["crates/vision-engine", "crates/vision-cli", "crates/vision-mcp", "crates/vision-browser"]
resolver = "3"

[workspace.package]
version = "0.0.1-alpha"
edition = "2024"
rust-version = "1.85"
authors = ["Mellouki Jamal"]
license = "Apache-2.0"
repository = "https://github.com/JamalMellouki/vision-mcp"
homepage = "https://github.com/JamalMellouki/vision-mcp"
documentation = "https://docs.rs/vision-engine"
description = "Browserless HTML/CSS rendering, layout auditing, and interactive sessions for coding agents."
keywords = ["html", "css", "render", "layout", "screenshot"]
categories = ["rendering", "web-programming", "command-line-utilities"]

[workspace.dependencies]
vision = { package = "vision-engine", path = "crates/vision-engine", version = "0.0.1-alpha" }
vision-mcp = { package = "vision-mcp", path = "crates/vision-mcp", version = "0.0.1-alpha" }
vision-browser = { package = "vision-browser", path = "crates/vision-browser", version = "0.0.1-alpha" }

[workspace.metadata.asynctric]
platform = "Asynctric"
developer = "Mellouki Jamal"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic and nursery default to allow. Enable individual lints when they
# catch a real defect rather than a style preference.
pedantic = "allow"
nursery = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
