[package]
name = "vision-engine"
description = "Browserless HTML/CSS rendering, layout auditing, and interactive sessions for coding agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "vision"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
cssparser = "0.38.0"
fontdb = "0.24.0"
html5ever = { version = "0.39.0", default-features = false, features = ["trace_tokenizer"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts"] }
markup5ever_rcdom = "0.39.0"
rquickjs = "0.11.0"
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
swash = "0.2.10"
thiserror = "2.0.21"
tiny-skia = "0.12.0"

[dev-dependencies]
serde_json = "1.0.154"
