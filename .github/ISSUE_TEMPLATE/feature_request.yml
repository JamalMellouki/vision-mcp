name: Feature request
description: Propose a CSS feature, adapter, or integration.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest change that solves the problem.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - HTML parser
        - CSS cascade
        - Text and fonts
        - Layout
        - Paint and images
        - Audit
        - Session and interactions
        - CLI
        - MCP
        - Adapters
        - Build and packaging
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What did you try, and why is it insufficient?
