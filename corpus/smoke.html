<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Vision smoke corpus</title>
<style>
  body { margin: 24px; font-family: sans-serif; color: #202124; }
  h1 { font-size: 28px; color: #174ea6; }
  .notice { padding: 12px; background: #e8f0fe; border: 1px solid #8ab4f8; }
  .arabic { direction: rtl; text-align: right; font-size: 18px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  td, th { border: 1px solid #999; padding: 6px; }
  caption { font-weight: bold; }
  form { margin-top: 12px; }
  input { width: 180px; }
  .chips { margin-top: 12px; }
  .chip { display: inline-block; margin-right: 8px; padding: 6px 10px; background: #e8f0fe; border: 1px solid #8ab4f8; }
  .inline-image { margin-right: 6px; }
</style>
</head>
<body>
<h1>Vision smoke corpus</h1>
<p>Latin text with <strong>bold</strong> and <em>italic</em> runs.</p>
<p class="arabic">مرحبا بالعالم — نص عربي لاختبار التشكيل.</p>
<div class="notice">A padded block with a visible border.</div>
<p class="chips">Atomic chips: <span class="chip">Alpha</span><span class="chip">Beta</span><span class="chip">Gamma</span><span class="chip">Delta</span></p>
<p><img class="inline-image" src="dot.svg" width="16" height="16" alt="">An image sits on the text baseline.</p>
<ul>
  <li>First item</li>
  <li>Second item</li>
</ul>
<table>
  <caption>Small table</caption>
  <tr><th colspan="2">Wide heading</th></tr>
  <tr><td>Left</td><td>Right</td></tr>
</table>
<form>
  <label>Name <input id="name" placeholder="Your name"></label>
  <button type="button">Continue</button>
</form>
</body>
</html>
